<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FlightDeals Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
*{box-sizing:border-box}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FDFDFB;font-family:Inter,system-ui,sans-serif;color:#1E2F52;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.t{position:absolute;white-space:nowrap}
.grey{color:#8A93A6}
.scene{position:absolute;inset:0;display:none;overflow:hidden;background:#FDFDFB}
.floor{position:absolute;left:-20%;width:140%;bottom:-560px;height:960px;background:radial-gradient(50% 50% at 50% 50%,#DBEEFD 0%,rgba(219,238,253,0) 100%)}
.card{position:absolute;background:#fff;border:1px solid #E9EEF5;box-shadow:0 18px 50px rgba(30,47,82,.08)}
.win{border-radius:72px;background:#FCFDFF;border:1px solid #E6ECF4;box-shadow:0 40px 120px rgba(30,47,82,.12);overflow:hidden}
.big{display:inline-block;font:800 210px/1 Inter;letter-spacing:-.055em;color:#1E2F52}
.btn{position:absolute;height:56px;border-radius:28px;background:#2F6BFF;color:#fff;font:700 22px Inter;overflow:hidden}
.btn .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ccard{position:absolute;background:#fff;border:1px solid #E9EEF5;box-shadow:0 24px 60px rgba(30,47,82,.10);overflow:hidden}
.cover{position:absolute;overflow:hidden;background:#cfdcec}
.cover>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fpill{position:absolute;display:flex;align-items:center;gap:10px;height:60px;padding:0 26px;border-radius:30px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(14px) saturate(1.4);color:#fff;font:600 24px Inter;white-space:nowrap}
.fdots{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(14px);color:#fff;font:800 20px Inter;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.cursor{position:absolute;left:0;top:0;width:40px;height:54px;transform-origin:4px 3px;z-index:50;opacity:0}
.toast{position:absolute;left:50%;top:0;display:flex;align-items:center;gap:16px;height:84px;padding:0 34px 0 16px;border-radius:42px;background:rgba(17,26,48,.84);backdrop-filter:blur(18px);color:#fff;font:600 26px Inter;box-shadow:0 20px 50px rgba(10,20,40,.25);white-space:nowrap;opacity:0;z-index:60}
#caps{position:absolute;left:0;right:0;bottom:80px;height:84px;z-index:100;pointer-events:none}
.cap{position:absolute;left:50%;top:0;height:84px;display:none;align-items:center;gap:14px;padding:0 38px;border-radius:42px;background:rgba(14,22,42,.76);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 14px 40px rgba(10,20,40,.22);font:700 44px Inter;letter-spacing:-.015em;color:#fff;white-space:nowrap}
.cap span{display:inline-block}
.wm{font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;letter-spacing:-.035em;white-space:nowrap}
.wm i{font-style:normal;color:#239587}
#s7word i,#s7smear i{color:#26A694}
</style></head>
<body><div id="stage"></div>
<svg width="0" height="0" style="position:absolute">
 <filter id="fv1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0 0"/></filter>
 <filter id="fh3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0 0"/></filter>
 <filter id="fh4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0 0"/></filter>
 <filter id="fv5" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0 0"/></filter>
 <filter id="fh7" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0 0"/></filter>
</svg>
<script>
// ===================== utils =====================
const DUR=21.2, VO=0.25;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:t=>t,outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),inExpo:t=>t<=0?0:Math.pow(2,10*t-10),outCubic:t=>1-Math.pow(1-t,3),inCubic:t=>t*t*t,inQuad:t=>t*t,inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2};
const tw=(u,a,b,v0,v1,e=E.outExpo)=>lerp(v0,v1,e(clamp((u-a)/(b-a))));
function kf(u,k,e=E.inOutCubic){if(u<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++){const[a,va]=k[i],[b,vb]=k[i+1];if(u<=b)return lerp(va,vb,e((u-a)/(b-a)));}return k[k.length-1][1];}
const spring=(x,f=1.6,d=6.5)=>x<=0?0:1-Math.exp(-d*x)*Math.cos(2*Math.PI*f*x);
const bump=(u,a,dur)=>Math.sin(Math.PI*clamp((u-a)/dur));
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const $=id=>document.getElementById(id);
const st=(el,o)=>{for(const k in o)el.style[k]=o[k];};
const f2=v=>(+v).toFixed(2);
const T=(x=0,y=0,s=1,r=0)=>`translate(${f2(x)}px,${f2(y)}px) rotate(${f2(r)}deg) scale(${(+s).toFixed(4)})`;
const BL=b=>b>0.05?`blur(${f2(b)}px)`:'none';
function dblur(el,fid,bx,by){if(bx<0.05&&by<0.05){el.style.filter='none';return;}$(fid).firstElementChild.setAttribute('stdDeviation',`${f2(bx)} ${f2(by)}`);el.style.filter=`url(#${fid})`;}
function setCur(id,x,y,s=1,r=0,op=1){st($(id),{transform:`translate(${f2(x-4)}px,${f2(y-3)}px) rotate(${f2(r)}deg) scale(${f2(s)})`,opacity:f2(op)});}

// ===================== icons & parts =====================
const PLANE='M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z';
const STAR='M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z';
const IC={
 plane:`<path d="${PLANE}"/>`,
 ticket:'<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>',
 carf:'<path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/>',
 key:'<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 chevL:'<path d="m15 18-6-6 6-6"/>',
 arrowR:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
 landing:'<path d="M2 22h20"/><path d="M3.77 10.77 2 9l2-4.5 1.1.55c.55.28.9.84.9 1.45s.35 1.17.9 1.45L8 8.5l3-6 1.05.53a2 2 0 0 1 1.09 1.52l.72 5.4a2 2 0 0 0 1.09 1.52l4.4 2.2c.42.22.78.55 1.01.96l.6 1.03c.49.88-.06 1.98-1.06 2.1l-1.18.15c-.47.06-.95-.02-1.37-.24L4.29 11.15a2 2 0 0 1-.52-.38Z"/>',
};
const icon=(n,s,c,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${IC[n]}</svg>`;
const starF=(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="flex:none"><path d="${STAR}" fill="${c}"/></svg>`;
const MARK_AR=422/318;
function logoMark(h){return `<img src="../assets/img/fd-mark.png" alt="" style="height:${f2(h)}px;width:${f2(h*MARK_AR)}px;display:block;flex:none">`;}
const WM='FlightDeals<i>.in</i>';
const CURSOR=`<svg width="40" height="54" viewBox="0 0 34 46" style="overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))"><path d="M3 2 L3 36 L11.5 28 L17.2 40.6 L22.6 38.2 L17 25.8 L28.6 25.8 Z" fill="#0B0B0F" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>`;
const cursorHTML=id=>`<div id="${id}" class="cursor">${CURSOR}</div>`;
function segTabs(active){const L=['Flights','Experiences','Transfers','Cars'];return `<div style="display:flex;gap:6px;padding:7px;border-radius:40px;background:#EEF3FA;border:1px solid #E3E8EF">${L.map((l,i)=>`<div style="padding:14px 26px;border-radius:32px;font:600 22px Inter;${i===active?'background:#fff;color:#2F6BFF;box-shadow:0 4px 14px rgba(30,47,82,.10)':'color:#7A859B'}">${l}</div>`).join('')}</div>`;}
function btnHTML(id,a,b,w){return `<div id="${id}" class="btn" style="right:24px;bottom:26px;width:${w}px"><div id="${id}rip" class="abs" style="left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:#4ED6A0;transform:scale(0)"></div><div id="${id}l" class="lbl">${a}</div><div id="${id}b" class="lbl" style="color:#0E3B2C;opacity:0">${icon('check',22,'#0E3B2C',3)}${b}</div></div>`;}
function bookBtn(id,u,tc){st($(id+'rip'),{transform:`scale(${f2(tw(u,tc,tc+0.32,0,1,E.outCubic))})`});st($(id+'l'),{opacity:f2(1-clamp((u-tc)/0.08))});st($(id+'b'),{opacity:f2(clamp((u-tc-0.05)/0.12))});}
function toastHTML(id,html){return `<div id="${id}" class="toast">${html}</div>`;}
function toast(id,u,a){const p=spring(u-a,1.3,7);st($(id),{opacity:u>=a?f2(clamp((u-a)/0.1)):'0',transform:`translate(-50%,${f2(lerp(-140,46,p))}px) scale(${f2(lerp(0.9,1,clamp((u-a)/0.25)))})`});}
function lineArt(c,op,cx,cy,r,vx,hy){return `<g fill="none" stroke="${c}" stroke-opacity="${op}" stroke-width="2"><circle cx="${cx}" cy="${cy}" r="${r}"/><line x1="0" y1="${hy}" x2="1600" y2="${hy}"/><line x1="${vx}" y1="0" x2="${vx}" y2="900"/></g><path d="M${vx} ${hy-24} Q${vx+3} ${hy-3} ${vx+24} ${hy} Q${vx+3} ${hy+3} ${vx} ${hy+24} Q${vx-3} ${hy+3} ${vx-24} ${hy} Q${vx-3} ${hy-3} ${vx} ${hy-24}Z" fill="${c}" opacity="${Math.min(1,op*5)}"/>`;}

// ===================== illustrations (viewBox 1600x900) =====================
function skyline(){let d='M0 621 L0 604 Q110 572 250 600',x=250,i=0;while(x<980){const w=18+hash(i)*34,h=6+hash(i+50)*26;d+=` L${x.toFixed(0)} ${(620-h).toFixed(0)} L${(x+w).toFixed(0)} ${(620-h).toFixed(0)}`;x+=w;i++;}d+=' L1000 621 Z';
 [[400,70],[414,86],[428,98],[442,88],[456,74],[470,60]].forEach(([sx,h])=>{d+=` M${sx-5} 621 L${sx-5} ${620-h+8} Q${sx} ${620-h-6} ${sx+5} ${620-h+8} L${sx+5} 621 Z`;});
 return d+' M690 621 L690 560 Q690 536 704 532 Q718 536 718 560 L718 621 Z';}
function artSea(id){
 let refl='';for(let i=0;i<22;i++){const y=626+i*i*0.55+i*3,w=24+i*16+hash(i)*30,x=1120-w/2+(hash(i+40)-.5)*40;refl+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(2.5+i*0.3).toFixed(1)}" rx="2" fill="#FFE7C2" opacity="${(0.75*(1-i/24)).toFixed(2)}"/>`;}
 let lines='';for(let i=0;i<16;i++){const y=640+i*16+hash(i+7)*10,x=hash(i+3)*1400;lines+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${(80+hash(i+9)*220).toFixed(0)}" height="2" rx="1" fill="#fff" opacity="${(0.06+hash(i+11)*0.08).toFixed(2)}"/>`;}
 return `<defs><linearGradient id="${id}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18306A"/><stop offset=".45" stop-color="#3B67AC"/><stop offset=".78" stop-color="#9CBDE4"/><stop offset="1" stop-color="#F1D3B4"/></linearGradient>
 <radialGradient id="${id}sun"><stop offset="0" stop-color="#FFF2D8" stop-opacity=".95"/><stop offset=".22" stop-color="#FFE2B6" stop-opacity=".55"/><stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/></radialGradient>
 <linearGradient id="${id}sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6487BE"/><stop offset=".25" stop-color="#31588F"/><stop offset="1" stop-color="#132A57"/></linearGradient>
 <linearGradient id="${id}sail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE7F6"/></linearGradient></defs>
 <g id="${id}art"><rect width="1600" height="621" fill="url(#${id}sky)"/><circle cx="1120" cy="590" r="360" fill="url(#${id}sun)"/><circle cx="1120" cy="592" r="54" fill="#FFF4DE"/>
 <path d="${skyline()}" fill="#2F5288" opacity=".9"/><rect y="620" width="1600" height="280" fill="url(#${id}sea)"/><g id="${id}refl">${refl}</g>${lines}
 <g id="${id}boat" transform="translate(560 700)"><path d="M-170 6 L190 6 Q178 30 150 34 L-140 34 Q-162 30 -170 6 Z" fill="#0D1C3A"/><rect x="-150" y="-6" width="320" height="14" rx="5" fill="#16294F"/>
 <path d="M6 -300 L6 -10 L170 -10 Z" fill="url(#${id}sail)"/><path d="M-6 -270 L-6 -10 L-140 -10 Z" fill="#E7EEF8"/><rect x="-2.5" y="-312" width="5" height="304" fill="#0D1C3A"/>
 <path d="M-210 46 Q-60 40 200 48" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none"/></g>
 ${lineArt('#fff',.14,1240,250,380,860,300)}</g>`;}
function artCity(id){
 let sp='';[[-260,300,44],[-195,380,50],[-130,440,56],[-64,500,60],[0,580,66],[64,500,60],[130,440,56],[195,380,50],[260,300,44]].forEach(([dx,h,w])=>{const x=800+dx,b=760,top=b-h;
  sp+=`<path d="M${x-w/2} ${b} L${x-w/2} ${top+w*1.4} Q${x-w/2} ${top+w*0.5} ${x} ${top} Q${x+w/2} ${top+w*0.5} ${x+w/2} ${top+w*1.4} L${x+w/2} ${b} Z" fill="url(#${id}sp)"/>`;
  for(let k=0;k<6;k++){const yy=top+w*1.6+k*((h-w*1.6)/7);sp+=`<ellipse cx="${x}" cy="${yy.toFixed(0)}" rx="${(w*0.12).toFixed(1)}" ry="${(w*0.2).toFixed(1)}" fill="#7EA2D4" opacity=".55"/>`;}
  sp+=`<circle cx="${x}" cy="${top+4}" r="${(w*0.14).toFixed(1)}" fill="#DCE8F7"/>`;});
 let bld='';for(let i=0;i<24;i++){const w=50+hash(i+5)*70,x=i*72-20,h=60+hash(i+9)*90;bld+=`<rect x="${x}" y="${(800-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="6" fill="#A8C4E6"/>`;}
 let tr='';for(let i=0;i<30;i++){const x=i*56+hash(i)*20,r=34+hash(i+3)*26;tr+=`<circle cx="${x.toFixed(0)}" cy="${(850-hash(i+7)*20).toFixed(0)}" r="${r.toFixed(0)}" fill="#1E3B69"/>`;}
 return `<defs><linearGradient id="${id}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB2E8"/><stop offset="1" stop-color="#E4F0FB"/></linearGradient>
 <linearGradient id="${id}sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4670B0"/><stop offset="1" stop-color="#23416F"/></linearGradient>
 <radialGradient id="${id}sun"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
 <g id="${id}art"><rect width="1600" height="900" fill="url(#${id}sky)"/><circle cx="1260" cy="170" r="260" fill="url(#${id}sun)"/>${bld}
 <path d="M520 800 L520 650 Q800 590 1080 650 L1080 800 Z" fill="#2B4C83"/>${sp}
 <path d="M640 800 L640 720 Q680 680 720 720 L720 800Z M760 800 L760 700 Q800 650 840 700 L840 800Z M880 800 L880 720 Q920 680 960 720 L960 800Z" fill="#4D72AE"/>
 <rect y="820" width="1600" height="80" fill="#1A3360"/>${tr}${lineArt('#fff',.16,1240,250,380,860,300)}</g>`;}
function artMount(id){
 const layer=(B,hmin,hmax,wmin,wmax,col,seed,x0=-60,x1=1660,bell=0)=>{let s='',x=x0,i=0;while(x<x1){const w=wmin+hash(seed+i)*(wmax-wmin);let h=hmin+hash(seed+i+99)*(hmax-hmin);if(bell){const d=(x-800)/600;h*=Math.exp(-d*d*1.4)*0.85+0.15;}s+=`<rect x="${x.toFixed(0)}" y="${(B-h).toFixed(0)}" width="${w.toFixed(0)}" height="${(h+400).toFixed(0)}" rx="${(w/2).toFixed(0)}" fill="${col}"/>`;x+=w*0.62;i++;}return s;};
 return `<defs><linearGradient id="${id}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9CBF0"/><stop offset="1" stop-color="#EFF6FD"/></linearGradient><radialGradient id="${id}sun"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
 <g id="${id}art"><rect width="1600" height="900" fill="url(#${id}sky)"/><circle cx="420" cy="200" r="240" fill="url(#${id}sun)"/>
 ${layer(560,60,160,90,150,'#B9CFEA',11)}${layer(640,160,420,60,100,'#86A6D2',23,200,1400,1)}${layer(760,120,330,60,96,'#5578B0',47,300,1350,1)}
 <path d="M0 820 Q400 760 800 800 T1600 790 L1600 900 L0 900Z" fill="#2B4A7E"/>
 <path d="M1080 520 L1560 260" stroke="#2B4A7E" stroke-width="2.5"/><rect x="1290" y="400" width="26" height="22" rx="5" fill="#2F6BFF"/>
 ${lineArt('#fff',.16,1240,250,380,860,300)}</g>`;}
function artMap(id){
 let minor='';for(let i=0;i<9;i++){const y=80+i*95;minor+=`<path d="M0 ${y} C 500 ${y-20} 1000 ${y+30} 1600 ${y-10}" stroke="#1D3463" stroke-width="7" fill="none"/>`;}
 return `<defs><clipPath id="${id}land"><path d="M0 0 H1600 V520 C1320 590 1090 720 980 900 H0 Z"/></clipPath>
 <pattern id="${id}grid" width="58" height="58" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="6" y="6" width="46" height="46" rx="10" fill="#1A2E5A"/></pattern>
 <filter id="${id}glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter></defs>
 <g id="${id}art"><rect width="1600" height="900" fill="#132447"/><rect width="1600" height="900" fill="url(#${id}grid)" clip-path="url(#${id}land)"/>
 <g clip-path="url(#${id}land)">${minor}<path d="M-40 860 L1300 20" stroke="#28457A" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M0 380 C 500 350 900 320 1600 250" stroke="#28457A" stroke-width="16" fill="none"/><path d="M250 0 C 320 300 380 600 470 900" stroke="#28457A" stroke-width="14" fill="none"/>
  <ellipse cx="1060" cy="520" rx="70" ry="44" fill="#173B54"/><ellipse cx="620" cy="250" rx="90" ry="50" fill="#173B54"/></g>
 <path d="M1600 520 C1320 590 1090 720 980 900 H1600 Z" fill="#0B1733"/><path d="M1600 520 C1320 590 1090 720 980 900" stroke="#2C4C84" stroke-width="4" fill="none"/>

const SEGS=[[0.04,1.41,'You booked the flight.',1],[1.72,2.56,'Now what?',0],[3.06,3.85,'FlightDeals',1],[3.85,5.19,'has the rest | of your trip',1],[5.26,5.74,'covered.',1],

function buildCaps(){const ch=[];let cur=null,last=-9;for(const[s,e,text,on]of SEGS){if(!on){cur=null;continue;}const toks=text.split(' ').filter(Boolean),words=toks.filter(x=>x!=='|'),tot=words.reduce((a,w)=>a+w.length+1,0);let tt=s;
 if(cur===null||s-last>0.6){cur={words:[]};ch.push(cur);}for(const tk of toks){if(tk==='|'){if(cur.words.length){cur={words:[]};ch.push(cur);}continue;}const d=(e-s)*(tk.length+1)/tot;cur.words.push({w:tk,t0:tt+VO,t1:tt+d+VO});tt+=d;}last=e;}
 ch.forEach(c=>{c.t0=c.words[0].t0;c.t1=c.words[c.words.length-1].t1;});return ch;}
let CH=[];
function capsHTML(){CH=buildCaps();return `<div id="caps">${CH.map((c,i)=>`<div id="cap${i}" class="cap">${c.words.map((w,j)=>`<span id="cw${i}_${j}">${w.w}</span>`).join('')}</div>`).join('')}</div>`;}

  st(el,{opacity:f2(inP*(1-outP)),transform:`translateX(-50%) translateY(${f2(lerp(14,0,inP))}px) scale(${f2(lerp(0.96,1,inP))})`});

function getSRT(){const fmt=s=>{const ms=Math.round(s*1000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,se=Math.floor(ms/1000)%60,r=ms%1000;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(se).padStart(2,'0')},${String(r).padStart(3,'0')}`;};
 const L=[['You booked the flight.',0.04,1.41],['Now what?',1.72,2.56],['FlightDeals has the rest of your trip covered.',3.06,5.74],['Experiences: tours and tickets, in a tap.',6.19,9.54],['Transfers: a ride waiting the moment you land.',9.70,12.76],['Rent a car: the right wheels, ready when you arrive.',13.11,16.58],['FlightDeals. More than flights.',17.0,19.22],['Book now.',19.39,20.12]];
